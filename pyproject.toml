[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowrecon"
version = "1.0.0"
description = "Authorized reconnaissance framework for defensive security testing"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "dnspython==2.8.0",
    "idna==3.20",
    "ipaddress==1.0.23",
    "lxml==6.1.3",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "mdurl==0.1.2",
    "packaging==26.3",
    "platformdirs==4.12.2",
    "Pygments==2.21.0",
    "requests==2.34.2",
    "rich==15.0.0",
    "soupsieve==2.10",
    "textual==8.2.8",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
]

[project.scripts]
shadowrecon = "shadowrecon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadowrecon*"]
exclude = ["wordlists*"]
