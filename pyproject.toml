[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowrecon"
version = "1.0.0"
description = "Authorized reconnaissance framework for defensive security testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shadowrecon = "shadowrecon.cli:main"

[tool.setuptools.packages.find]
include = ["shadowrecon*"]
